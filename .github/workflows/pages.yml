name: Publish book website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "source/book/**"
      - "editions/**"
      - "multilingual/**"
      - "assets/cover-page-1.png"
      - "requirements-multilingual.txt"
      - "Makefile"
      - "scripts/build-site.sh"
      - "scripts/build-web-edition.py"
      - "scripts/multilingual_common.py"
      - "scripts/multilingual_render.py"
      - "scripts/prepare_multilingual.py"
      - "scripts/validate_multilingual.py"
      - "scripts/validate-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Use the accepted multilingual toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pandoc 2.12
        uses: pandoc/actions/setup@v1
        with:
          version: "2.12"

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils qpdf rsync
          python3 -m pip install --disable-pip-version-check -r requirements-multilingual.txt

      - name: Assemble and validate the site
        run: make verify-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
